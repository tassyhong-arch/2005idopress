<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 최적화 이북 리더</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
    <link rel="apple-touch-icon" href="./icons/icon-192.svg">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="이북리더">
    <meta name="description" content="인터넷 없이도 도서를 읽을 수 있는 PWA 이북 리더">
</head>
<body>
    <!-- 교보문고 스타일 헤더 (탭 시 숨김) -->
    <header class="header" id="readerHeader">
        <div class="header-content">
            <button id="backBtn" class="header-icon-btn" title="도서 목록으로">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="book-title" id="headerBookTitle">이북 리더</h1>
            <button id="menuBtn" class="header-icon-btn" title="메뉴">
                <i class="fas fa-ellipsis-v"></i>
            </button>
        </div>
        <div class="reading-progress-bar">
            <div id="headerProgressFill" class="progress-fill"></div>
        </div>
    </header>
    <main class="main-content">
        <div class="content-wrapper">
            <div id="bookContent" class="book-content">
            </div>
        </div>
    </main>
    <!-- 교보문고 스타일 하단 플로팅 메뉴 (탭 시 숨김) -->
    <nav class="bottom-nav" id="readerBottomNav">
        <!-- 페이지 슬라이더 -->
        <div class="page-slider-container">
            <div class="page-slider-info">
                <span id="currentPage">1</span> / <span id="totalPages">1</span>
                <span id="progressText" class="progress-percentage">0%</span>
            </div>
            <input type="range" id="pageSlider" class="page-slider" min="1" max="1" value="1" step="1">
        </div>
        
        <!-- 하단 툴바 -->
        <div class="bottom-toolbar">
            <button id="bottomTTSBtn" class="toolbar-btn" title="듣기">
                <i class="fas fa-headphones"></i>
                <span>듣기</span>
            </button>
            <button id="bottomBookmarkBtn" class="toolbar-btn" title="북마크">
                <i class="fas fa-bookmark"></i>
                <span>북마크</span>
            </button>
            <button id="bottomHighlightBtn" class="toolbar-btn" title="하이라이트">
                <i class="fas fa-highlighter"></i>
                <span>표시</span>
            </button>
            <button id="bottomSearchBtn" class="toolbar-btn" title="검색">
                <i class="fas fa-search"></i>
                <span>검색</span>
            </button>
            <button id="bottomSettingsBtn" class="toolbar-btn" title="설정">
                <i class="fas fa-cog"></i>
                <span>설정</span>
            </button>
        </div>
    </nav>
    <!-- 교보문고 스타일 빠른 설정 팝업 -->
    <div id="quickSettingsPanel" class="quick-settings-panel">
        <div class="quick-settings-content">
            <!-- 폰트 크기 -->
            <div class="quick-setting-section">
                <label class="quick-setting-label">
                    <i class="fas fa-font"></i> 글자 크기
                </label>
                <div class="font-size-control">
                    <button id="qsFontDecrease" class="quick-btn" title="작게">
                        <i class="fas fa-minus"></i>
                    </button>
                    <span id="qsFontSize" class="font-size-value">16px</span>
                    <button id="qsFontIncrease" class="quick-btn" title="크게">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- 테마 -->
            <div class="quick-setting-section">
                <label class="quick-setting-label">
                    <i class="fas fa-palette"></i> 테마
                </label>
                <div class="theme-buttons">
                    <button class="theme-btn active" data-theme="light">
                        <div class="theme-preview light-theme"></div>
                        <span>밝게</span>
                    </button>
                    <button class="theme-btn" data-theme="dark">
                        <div class="theme-preview dark-theme"></div>
                        <span>어둡게</span>
                    </button>
                    <button class="theme-btn" data-theme="sepia">
                        <div class="theme-preview sepia-theme"></div>
                        <span>세피아</span>
                    </button>
                </div>
            </div>

            <!-- 줄 간격 -->
            <div class="quick-setting-section">
                <label class="quick-setting-label">
                    <i class="fas fa-align-justify"></i> 줄 간격
                </label>
                <div class="spacing-control">
                    <button class="spacing-btn" data-spacing="1.2">좁게</button>
                    <button class="spacing-btn active" data-spacing="1.5">보통</button>
                    <button class="spacing-btn" data-spacing="1.8">넓게</button>
                    <button class="spacing-btn" data-spacing="2.0">매우 넓게</button>
                </div>
            </div>

            <!-- 도서 관리 버튼 -->
            <button id="qsBookManager" class="quick-action-btn">
                <i class="fas fa-book"></i> 도서 관리
            </button>
        </div>
    </div>

    <!-- 기존 설정 모달 (상세 설정용) -->
    <div id="settingsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>상세 설정</h2>
                <button id="closeModal" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label>테마</label>
                    <select id="themeSelect">
                        <option value="light">라이트</option>
                        <option value="dark">다크</option>
                        <option value="sepia">세피아</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>줄 간격</label>
                    <select id="lineHeightSelect">
                        <option value="1.2">좁게</option>
                        <option value="1.5" selected>보통</option>
                        <option value="1.8">넓게</option>
                        <option value="2.0">매우 넓게</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>글자 간격</label>
                    <select id="letterSpacingSelect">
                        <option value="normal">보통</option>
                        <option value="0.05em">넓게</option>
                        <option value="0.1em">매우 넓게</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div id="bookModal" class="modal">
        <div class="modal-content book-modal">
            <div class="modal-header">
                <h2>도서 관리</h2>
                <button id="closeBookModal" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="book-actions">
                    <button id="downloadBookBtn" class="action-btn primary">
                        <i class="fas fa-download"></i> 도서 다운로드
                    </button>
                    <button id="addTextBookBtn" class="action-btn secondary">
                        <i class="fas fa-plus"></i> 텍스트 추가
                    </button>
                    <button id="loadSampleBtn" class="action-btn success">
                        <i class="fas fa-book-open"></i> 샘플 도서 (주생전)
                    </button>
                    <button id="storageStatsBtn" class="action-btn info">
                        <i class="fas fa-chart-pie"></i> 저장소 통계
                    </button>
                </div>
                <div id="bookList" class="book-list">
                    <div class="empty-state">
                        <i class="fas fa-book"></i>
                        <p><strong>저장된 도서가 없습니다</strong></p>
                        <small style="display: block; margin-top: 8px;">
                            📥 위의 <strong>"도서 다운로드"</strong> 또는 <strong>"텍스트 추가"</strong> 버튼을 눌러<br>
                            새 도서를 추가하세요!
                        </small>
                        <small style="display: block; margin-top: 12px; color: #6c757d;">
                            💡 팁: 현재 보고 있는 "기본 도서"는 샘플입니다.<br>
                            원하는 텍스트를 추가하여 나만의 도서관을 만드세요!
                        </small>
                    </div>
                </div>
                <div class="storage-info">
                    <div class="storage-bar">
                        <div id="storageUsed" class="storage-used"></div>
                    </div>
                    <div class="storage-text">
                        <span id="storageText">0MB / 100MB (0%)</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="ttsModal" class="modal">
        <div class="modal-content tts-modal">
            <div class="modal-header">
                <h2>
                    <i class="fas fa-headphones"></i> 음성 듣기 (TTS)
                </h2>
                <button id="closeTtsModal" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="tts-controls">
                    <div class="tts-playback-controls">
                        <button id="ttsPlayBtn" class="tts-control-btn primary" title="재생">
                            <i class="fas fa-play"></i>
                        </button>
                        <button id="ttsPauseBtn" class="tts-control-btn" title="일시정지" style="display: none;">
                            <i class="fas fa-pause"></i>
                        </button>
                        <button id="ttsStopBtn" class="tts-control-btn" title="정지">
                            <i class="fas fa-stop"></i>
                        </button>
                    </div>
                    
                    <div class="setting-group">
                        <label>
                            <i class="fas fa-tachometer-alt"></i> 재생 속도
                            <span id="ttsRateDisplay" class="value-display">1.0x</span>
                        </label>
                        <input type="range" id="ttsRate" min="0.5" max="2.0" step="0.1" value="1.0">
                        <div class="rate-markers">
                            <span>0.5x</span>
                            <span>1.0x</span>
                            <span>1.5x</span>
                            <span>2.0x</span>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label>
                            <i class="fas fa-volume-up"></i> 음성 선택
                        </label>
                        <select id="ttsVoice" class="tts-voice-select">
                            <option value="">기본 음성</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="ttsAutoPageTurn" checked>
                            <span><i class="fas fa-arrow-right"></i> 자동 페이지 넘김</span>
                        </label>
                    </div>

                    <div class="tts-status">
                        <div class="tts-status-item">
                            <i class="fas fa-info-circle"></i>
                            <span id="ttsStatus">준비됨</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="notification" class="notification">
        <span id="notificationText"></span>
    </div>
    <div id="scrollProgress" class="scroll-progress"></div>
    <div id="installPrompt" class="install-prompt">
        <div class="install-content">
            <span>앱을 설치하여 오프라인에서도 도서를 읽으세요! 📚</span>
            <div class="install-buttons">
                <button id="installBtn" class="install-btn">설치</button>
                <button id="dismissInstall" class="dismiss-btn">닫기</button>
            </div>
        </div>
    </div>
    <!-- 순서 중요: storage -> reader -> app -> 나머지 -->
    <script src="js/storage.js"></script>
    <script src="js/reader.js"></script>
    <script src="js/tts.js"></script>
    <script src="js/download.js"></script>
    <script src="js/book-manager.js"></script>
    <script src="js/app.js"></script>
    <script src="js/modern-ui.js"></script>
    <script src="js/responsive.js"></script>
    <script src="js/search.js"></script>
    <script src="js/bookmark.js"></script>
    <script src="js/highlight.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
