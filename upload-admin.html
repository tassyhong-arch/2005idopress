<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 업로드 관리자 - 이북 리더</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/library.css">
    <link rel="stylesheet" href="css/upload-admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
</head>
<body>
    <div class="upload-admin-container">
        <!-- 헤더 -->
        <header class="admin-header">
            <button id="backToLibrary" class="back-btn">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1>
                <i class="fas fa-cloud-upload-alt"></i>
                도서 업로드 관리자
            </h1>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar"></div>
                <span id="userName">관리자</span>
            </div>
        </header>

        <!-- 메인 컨텐츠 -->
        <main class="admin-main">
            <!-- 업로드 영역 -->
            <section class="upload-section">
                <div class="upload-card">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <h2>공개 도서관에 도서 등록</h2>
                    <p class="upload-description">
                        모든 사용자가 볼 수 있는 공개 도서관에<br>
                        새로운 책을 등록하세요
                    </p>
                    
                    <div class="book-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="bookTitle">
                                    <i class="fas fa-book"></i> 책 제목 *
                                </label>
                                <input type="text" id="bookTitle" placeholder="예: 홍길동전" required>
                            </div>
                            <div class="form-group">
                                <label for="bookAuthor">
                                    <i class="fas fa-user"></i> 작가 *
                                </label>
                                <input type="text" id="bookAuthor" placeholder="예: 허균" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="bookSummary">
                                <i class="fas fa-align-left"></i> 간단 요약 *
                            </label>
                            <textarea id="bookSummary" rows="3" placeholder="예: 조선시대 영웅 홍길동의 파란만장한 모험을 그린 고전소설..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="bookCategory">
                                <i class="fas fa-tag"></i> 카테고리
                            </label>
                            <select id="bookCategory">
                                <option value="일반">일반</option>
                                <option value="고전소설">고전소설</option>
                                <option value="현대문학">현대문학</option>
                                <option value="시">시</option>
                                <option value="에세이">에세이</option>
                                <option value="자기계발">자기계발</option>
                                <option value="역사">역사</option>
                                <option value="과학">과학</option>
                                <option value="기타">기타</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="gdriveLinkInput">
                                <i class="fab fa-google-drive"></i> 구글 드라이브 링크 *
                            </label>
                            <input type="url" id="gdriveLinkInput" placeholder="https://docs.google.com/document/d/..." required>
                        </div>

                        <button id="addBookBtn" class="btn-add-book">
                            <i class="fas fa-plus-circle"></i>
                            도서관에 등록
                        </button>
                    </div>

                    <div class="upload-info">
                        <div class="info-item">
                            <i class="fas fa-users"></i>
                            <span>모든 사용자가 도서관에서 이 책을 볼 수 있습니다</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-download"></i>
                            <span>사용자가 "내 서재에 추가"하면 텍스트가 다운로드됩니다</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-shield-alt"></i>
                            <span>구글 문서는 "링크가 있는 모든 사용자"로 공개 설정 필요</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 업로드 진행 상태 -->
            <section class="upload-progress-section" id="uploadProgressSection" style="display: none;">
                <h3><i class="fas fa-spinner fa-spin"></i> 업로드 진행중...</h3>
                <div id="uploadProgressList" class="progress-list"></div>
            </section>

            <!-- 최근 업로드 -->
            <section class="recent-uploads-section">
                <div class="section-header">
                    <h3><i class="fas fa-history"></i> 최근 업로드</h3>
                    <button id="refreshBtn" class="icon-btn" title="새로고침">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div id="recentUploadsList" class="uploads-list">
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>최근 업로드된 도서가 없습니다</p>
                    </div>
                </div>
            </section>

            <!-- 도서 통계 -->
            <section class="storage-section">
                <h3><i class="fas fa-chart-bar"></i> 도서 통계</h3>
                <div class="storage-stats">
                    <div class="storage-details">
                        <div class="stat-item">
                            <i class="fas fa-book-open"></i>
                            <div>
                                <strong id="totalBooksCount">0</strong>
                                <span>공개 도서관</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <i class="fab fa-google-drive"></i>
                            <div>
                                <strong id="gdriveCount">0</strong>
                                <span>등록된 도서</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-users"></i>
                            <div>
                                <strong id="textCount">0</strong>
                                <span>사용자 서재</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-hdd"></i>
                            <div>
                                <strong id="storageSizeText">0 B</strong>
                                <span>서재 용량</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 텍스트 입력 모달 -->
    <div id="textInputModal" class="modal">
        <div class="modal-content text-input-modal">
            <div class="modal-header">
                <h2><i class="fas fa-pen"></i> 텍스트 직접 입력</h2>
                <button id="closeTextModal" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="bookTitleInput">
                        <i class="fas fa-book"></i> 도서 제목 *
                    </label>
                    <input type="text" id="bookTitleInput" placeholder="예: 나의 첫 번째 소설" required>
                </div>
                <div class="form-group">
                    <label for="bookContentInput">
                        <i class="fas fa-align-left"></i> 내용 *
                    </label>
                    <textarea id="bookContentInput" rows="15" placeholder="여기에 텍스트를 입력하세요...&#10;&#10;여러 줄의 텍스트를 입력할 수 있습니다." required></textarea>
                </div>
                <div class="modal-actions">
                    <button id="cancelTextBtn" class="btn-secondary">
                        <i class="fas fa-times"></i> 취소
                    </button>
                    <button id="saveTextBtn" class="btn-primary">
                        <i class="fas fa-save"></i> 저장
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 알림 -->
    <div id="notification" class="notification">
        <span id="notificationText"></span>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/public-library.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/upload-admin.js"></script>
</body>
</html>
