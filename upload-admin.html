<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 업로드 관리자 - 이북 리더</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/library.css">
    <link rel="stylesheet" href="css/upload-admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
</head>
<body>
    <div class="upload-admin-container">
        <!-- 헤더 -->
        <header class="admin-header">
            <button id="backToLibrary" class="back-btn">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1>
                <i class="fas fa-cloud-upload-alt"></i>
                도서 업로드 관리자
            </h1>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar"></div>
                <span id="userName">관리자</span>
            </div>
        </header>

        <!-- 메인 컨텐츠 -->
        <main class="admin-main">
            <!-- 업로드 영역 -->
            <section class="upload-section">
                <div class="upload-card">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <h2>새 도서 추가</h2>
                    <p class="upload-description">
                        구글 드라이브 문서 링크를 입력하여<br>
                        가볍고 빠른 도서관을 만드세요
                    </p>
                    
                    <div class="link-input-zone" id="linkInputZone">
                        <div class="link-icon">
                            <i class="fab fa-google-drive"></i>
                        </div>
                        <input type="url" id="gdriveLinkInput" class="gdrive-link-input" 
                               placeholder="https://docs.google.com/document/d/..." 
                               aria-label="구글 드라이브 링크">
                        <button id="addLinkBtn" class="add-link-btn">
                            <i class="fas fa-plus-circle"></i>
                            추가
                        </button>
                    </div>
                    
                    <div class="upload-buttons">
                        <button id="addTextBtn" class="btn-secondary">
                            <i class="fas fa-edit"></i>
                            텍스트 직접 입력
                        </button>
                    </div>

                    <div class="upload-info">
                        <div class="info-item">
                            <i class="fas fa-check-circle"></i>
                            <span>지원: 구글 문서(Docs), 스프레드시트(Sheets)</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-feather"></i>
                            <span>용량: 링크만 저장하여 앱이 가벼움</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-sync-alt"></i>
                            <span>실시간: 드라이브에서 수정하면 자동 반영</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-shield-alt"></i>
                            <span>공개 권한: 링크가 있는 모든 사용자가 볼 수 있도록 설정 필요</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 업로드 진행 상태 -->
            <section class="upload-progress-section" id="uploadProgressSection" style="display: none;">
                <h3><i class="fas fa-spinner fa-spin"></i> 업로드 진행중...</h3>
                <div id="uploadProgressList" class="progress-list"></div>
            </section>

            <!-- 최근 업로드 -->
            <section class="recent-uploads-section">
                <div class="section-header">
                    <h3><i class="fas fa-history"></i> 최근 업로드</h3>
                    <button id="refreshBtn" class="icon-btn" title="새로고침">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div id="recentUploadsList" class="uploads-list">
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>최근 업로드된 도서가 없습니다</p>
                    </div>
                </div>
            </section>

            <!-- 도서 통계 -->
            <section class="storage-section">
                <h3><i class="fas fa-chart-bar"></i> 도서 통계</h3>
                <div class="storage-stats">
                    <div class="storage-details">
                        <div class="stat-item">
                            <i class="fas fa-book"></i>
                            <div>
                                <strong id="totalBooksCount">0</strong>
                                <span>전체 도서</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <i class="fab fa-google-drive"></i>
                            <div>
                                <strong id="gdriveCount">0</strong>
                                <span>구글 드라이브</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-file-alt"></i>
                            <div>
                                <strong id="textCount">0</strong>
                                <span>텍스트</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-feather"></i>
                            <div>
                                <strong id="storageSizeText">~1 KB</strong>
                                <span>저장 용량</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 텍스트 입력 모달 -->
    <div id="textInputModal" class="modal">
        <div class="modal-content text-input-modal">
            <div class="modal-header">
                <h2><i class="fas fa-pen"></i> 텍스트 직접 입력</h2>
                <button id="closeTextModal" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="bookTitleInput">
                        <i class="fas fa-book"></i> 도서 제목 *
                    </label>
                    <input type="text" id="bookTitleInput" placeholder="예: 나의 첫 번째 소설" required>
                </div>
                <div class="form-group">
                    <label for="bookContentInput">
                        <i class="fas fa-align-left"></i> 내용 *
                    </label>
                    <textarea id="bookContentInput" rows="15" placeholder="여기에 텍스트를 입력하세요...&#10;&#10;여러 줄의 텍스트를 입력할 수 있습니다." required></textarea>
                </div>
                <div class="modal-actions">
                    <button id="cancelTextBtn" class="btn-secondary">
                        <i class="fas fa-times"></i> 취소
                    </button>
                    <button id="saveTextBtn" class="btn-primary">
                        <i class="fas fa-save"></i> 저장
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 알림 -->
    <div id="notification" class="notification">
        <span id="notificationText"></span>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/upload-admin.js"></script>
</body>
</html>
